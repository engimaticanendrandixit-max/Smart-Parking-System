
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSense - Smart Parking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
            color: #f8fafc;
        }
        @keyframes car-move {
            0% { transform: translateX(-5px) rotate(0deg); }
            50% { transform: translateX(5px) rotate(1deg); }
            100% { transform: translateX(-5px) rotate(0deg); }
        }
        @keyframes bike-lean {
            0% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
            100% { transform: rotate(-2deg); }
        }
        @keyframes pulse-intense {
            0%, 100% { opacity: 1; filter: brightness(1); }
            50% { opacity: 0.7; filter: brightness(1.3); }
        }
        .animate-car {
            animation: car-move 2s ease-in-out infinite;
        }
        .animate-bike {
            animation: bike-lean 1.5s ease-in-out infinite;
        }
        .animate-pulse-intense {
            animation: pulse-intense 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .dark-card {
            background-color: #0f172a; /* slate-900 */
            border: 1px solid #1e293b; /* slate-800 */
        }
        /* Custom scrollbar for slot grid */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #020617;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
    </style>
